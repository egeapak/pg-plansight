name: CI

on:
  push:
    branches: [main, master]
  # Every PR, whatever its base, so stacked PRs are checked too.
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege: none of these jobs write to the repository. The default
# token scope is repository-wide, so it has to be narrowed explicitly.
permissions:
  contents: read

jobs:
  check:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      # Non-default features have their own code paths (#[cfg(feature)] tests
      # and cfg(not(feature)) arms) that a default-features-only run never
      # compiles or executes.
      - name: Run tests (all features — exporter OTel backend, regression engine)
        run: cargo nextest run --workspace --all-features --no-fail-fast

      - name: Check core feature combinations
        run: |
          # The embeddable build the pg extension links (no rayon, no file IO).
          # `--all-targets` so examples and benches are gated too, not just the lib.
          cargo check -p pg-plansight-core --no-default-features --all-targets
          # Intermediate combinations relied on by cfg(all(...)) gates
          cargo check -p pg-plansight-core --no-default-features --features file-io
          cargo check -p pg-plansight-core --no-default-features --features parallel
          cargo check -p pg-plansight-core --no-default-features --features regression-analysis

      - name: Test core without default features
        run: cargo nextest run -p pg-plansight-core --no-default-features --no-fail-fast

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every crate declares rust-version = "1.96"; verify it actually builds
      # there so the claim doesn't rot as stable advances.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-features --all-targets

  cross-arch:
    name: Cross-arch (aarch64 NEON + scalar fallbacks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `rust-toolchain.toml` pins the channel to the MSRV, which outranks the
      # rustup *default* the action sets — so a `targets:` input on the action
      # would install them into `stable` while the build ran under the pinned
      # toolchain and failed with "can't find crate for `core`". Adding the
      # targets explicitly applies them to whichever toolchain is active, and
      # keeps working when the MSRV moves.
      - name: Add cross targets to the active toolchain
        run: rustup target add aarch64-unknown-linux-gnu i686-unknown-linux-gnu

      - name: Install cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      # `simd_scan` dispatches through fearless_simd at its baseline level:
      # SSE2 on x86_64, NEON on aarch64, scalar everywhere else. An x86_64-only
      # CI never compiles the NEON kernels, let alone runs the differential
      # tests that are the only thing keeping those scanners honest against the
      # regexes they replace.
      - name: Test core on aarch64 under emulation (exercises NEON)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        # One invocation only: cross-building the dev-dependency tree
        # (testcontainers -> bollard -> rustls/ring) is the expensive part, and
        # a second run would rebuild all of it to exercise the same scanners.
        # The no-default-features configuration is already covered on x86_64.
        run: cargo test --target aarch64-unknown-linux-gnu -p pg-plansight-core --all-features --lib

      # A third architecture with neither back-end, so the scalar dispatch arm
      # is compiled by something on every PR. i686 is `target_arch = "x86"`,
      # which takes the generic arm, and packages.yml already ships it — but
      # only on a tag, so today a typo there would not surface until release.
      # Check-only, lib-only: `--all-targets` would need 32-bit C headers.
      - name: Check core on i686 (scalar dispatch arm)
        run: cargo check --target i686-unknown-linux-gnu -p pg-plansight-core --all-features

  # Releases build only on a tag, so a new dependency that needs a system
  # library (libssl, a glibc-only C API) would otherwise first fail the static
  # musl build at release time.
  static-musl:
    name: Static musl build (x86_64)
    runs-on: ubuntu-latest
    env:
      # Keep in step with CROSS_REV in packages.yml (matches Cross.toml's images).
      CROSS_REV: 846d469b1f08d49429d4ca834ee5a60f5d055e19
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
          cache-on-failure: true

      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV"

      - name: Build the CLI and exporter
        run: |
          cross build --release --locked --target x86_64-unknown-linux-musl -p pg-plansight
          cross build --release --locked --target x86_64-unknown-linux-musl -p pg-plansight-exporter --features opentelemetry

      - name: Assert the binaries are static and run
        run: |
          for bin in pg-plansight pg-plansight-exporter; do
            f=target/x86_64-unknown-linux-musl/release/$bin
            if readelf -l -W "$f" | grep -q INTERP || readelf -d "$f" | grep -q NEEDED; then
              echo "::error::$bin is dynamically linked"; readelf -d "$f"; exit 1
            fi
            "$f" --version
          done

  integration:
    name: Integration (real PostgreSQL via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # These tests spin up PostgreSQL with auto_explain in Docker and parse
      # its real output — the only executed coverage of the genuine format.
      - name: Run Docker-backed integration tests
        run: cargo test -p pg-plansight-core --all-features --test integration_test -- --include-ignored

  supply-chain:
    name: Supply chain (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `advisories` gates RUSTSEC vulnerabilities and yanked crates;
      # `licenses` guards against copyleft entering a tree that links into
      # PostgreSQL and ships as MIT; `sources` rejects anything from outside
      # crates.io. Configuration lives in deny.toml.
      - name: cargo-deny (workspace)
        run: cargo deny --all-features check

      # The extension is its own workspace with its own lockfile, so it is not
      # covered by the run above.
      - name: cargo-deny (pg_extension)
        run: cargo deny --manifest-path crates/pg_extension/Cargo.toml check advisories sources

      - name: cargo-deny (pg_extension, PG12)
        run: cargo deny --manifest-path crates/pg_extension/pg12/Cargo.toml check advisories sources
