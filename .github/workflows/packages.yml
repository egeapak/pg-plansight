name: Release Packages (DEB & RPM)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Packages are versioned from Cargo.toml, so a tag that doesn't match
      # would publish artifacts under the wrong version. (Runs after the
      # toolchain install: cargo metadata needs cargo.)
      - name: Verify tag matches crate versions (CLI + extension, lockstep)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pg-plansight") | .version')
          ext_version=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path crates/pg_extension/Cargo.toml \
            | jq -r '.packages[] | select(.name == "pg_plansight") | .version')
          if [ "$tag" != "$cli_version" ]; then
            echo "Tag v$tag does not match pg-plansight version $cli_version" >&2
            exit 1
          fi
          if [ "$tag" != "$ext_version" ]; then
            echo "Tag v$tag does not match pg_plansight extension version $ext_version" >&2
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm@0.19.0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build packages for ${{ matrix.target }}
        run: just build-all ${{ matrix.target }}

      - name: Validate packages
        run: |
          just validate-deb ${{ matrix.target }}
          just validate-rpm ${{ matrix.target }}

      - name: Upload DEB packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb
          retention-days: 30

      - name: Upload RPM packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-packages-${{ matrix.target }}
          path: target/${{ matrix.target }}/generate-rpm/*.rpm
          retention-days: 30

  build-extension-packages:
    name: Build Extension (PG ${{ matrix.pg }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Add the PGDG apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common curl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y

      - name: Install PostgreSQL ${{ matrix.pg }} + dev headers
        run: |
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libclang-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pg_extension
          key: pg${{ matrix.pg }}-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --locked --version "=0.19.1"

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm@0.19.0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Initialize pgrx against the system PostgreSQL
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Build & package extension (deb + rpm)
        run: |
          just ext-build ${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          cd crates/pg_extension
          cargo deb --no-build --variant pg${{ matrix.pg }}
          cargo generate-rpm --variant pg${{ matrix.pg }} --auto-req disabled

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ext-deb-${{ matrix.arch }}-pg${{ matrix.pg }}
          path: crates/pg_extension/target/debian/*.deb
          retention-days: 30

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: ext-rpm-${{ matrix.arch }}-pg${{ matrix.pg }}
          path: crates/pg_extension/target/generate-rpm/*.rpm
          retention-days: 30

  test-extension-deb:
    name: Test Extension DEB (PG ${{ matrix.pg }})
    needs: build-extension-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18]

    steps:
      - name: Download extension DEB (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ext-deb-x86_64-pg${{ matrix.pg }}
          path: pkg

      - name: Install into a real PostgreSQL ${{ matrix.pg }} and load the extension
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres "postgres:${{ matrix.pg }}"
          # Wait for the server to accept connections (bounded).
          for _ in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec pg pg_isready -U postgres
          deb=$(ls pkg/*.deb | head -1)
          echo "Installing $deb"
          docker cp "$deb" pg:/tmp/ext.deb
          # dpkg first; apt -f resolves the postgresql-NN dependency if needed
          # (it is already present in the official image, so this is a no-op).
          docker exec pg bash -c 'apt-get update -qq && (dpkg -i /tmp/ext.deb || apt-get install -f -y)'
          docker exec pg psql -U postgres -c 'CREATE EXTENSION pg_plansight;'
          docker exec pg psql -U postgres -c 'SELECT * FROM plansight_check();'
          docker rm -f pg

  create-release:
    name: Create Release
    needs: [build-packages, build-extension-packages, test-extension-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Publishing a release + uploading assets needs write access to repo
    # contents; the default GITHUB_TOKEN is read-only, which 403s action-gh-release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Organize packages
        run: |
          mkdir -p release-packages
          find packages -name "*.deb" -exec cp {} release-packages/ \;
          find packages -name "*.rpm" -exec cp {} release-packages/ \;
          ls -la release-packages/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-deb-packages:
    name: Test DEB Package Installation
    needs: build-packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]

    steps:
      - uses: actions/checkout@v7

      - name: Download DEB packages
        uses: actions/download-artifact@v8
        with:
          name: deb-packages-${{ matrix.target }}
          path: packages

      - name: Test DEB package installation
        run: |
          echo "Testing DEB package installation..."
          ls -la packages/

          # Install packages
          for deb in packages/*.deb; do
            echo "Installing $deb..."
            sudo dpkg -i "$deb"
          done

          # Test binaries exist and run
          echo "Testing installed binaries..."
          pg-plansight --version
          pg-plansight-exporter --version

          # Check systemd service file exists
          echo "Checking systemd service..."
          test -f /lib/systemd/system/pg-plansight-exporter.service || test -f /usr/lib/systemd/system/pg-plansight-exporter.service

          # Test configuration directory exists
          echo "Checking configuration..."
          test -d /etc/pg-plansight-exporter

          echo "DEB installation test completed!"

  test-rpm-packages:
    name: Test RPM Package Installation
    needs: build-packages
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y rpm dpkg systemd

      - name: Download RPM packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-packages-${{ matrix.target }}
          path: packages

      - name: Test RPM package installation
        run: |
          echo "Testing RPM package installation..."
          ls -la packages/

          # Install packages
          for rpm in packages/*.rpm; do
            echo "Installing $rpm..."
            rpm -i "$rpm" || true
          done

          # Test binaries
          echo "Testing installed binaries..."
          /usr/bin/pg-plansight --version
          /usr/bin/pg-plansight-exporter --version

          # Check systemd service file
          echo "Checking systemd service file..."
          ls -la /usr/lib/systemd/system/pg-plansight-exporter.service || true
          cat /usr/lib/systemd/system/pg-plansight-exporter.service || true

          echo "RPM installation test completed!"

  package-summary:
    name: Package Build Summary
    needs: [build-packages, test-deb-packages, test-rpm-packages, build-extension-packages]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download all DEB artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*deb-*'
          path: deb-packages
          merge-multiple: true

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*rpm-*'
          path: rpm-packages
          merge-multiple: true

      - name: Generate package summary
        run: |
          echo "# Package Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## DEB Packages (Debian/Ubuntu)" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size | Architecture |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------------|" >> $GITHUB_STEP_SUMMARY

          find deb-packages -name "*.deb" -exec sh -c '
            package=$(basename "$1")
            size=$(du -h "$1" | cut -f1)
            arch=$(echo "$package" | grep -o "_[^_]*\.deb$" | sed "s/_\|\.deb//g")
            echo "| $package | $size | $arch |"
          ' _ {} \; >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## RPM Packages (RHEL/Fedora/CentOS)" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size | Architecture |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------------|" >> $GITHUB_STEP_SUMMARY

          find rpm-packages -name "*.rpm" -exec sh -c '
            package=$(basename "$1")
            size=$(du -h "$1" | cut -f1)
            arch=$(echo "$package" | grep -o "\.[^.]*\.rpm$" | sed "s/\.\|rpm//g")
            echo "| $package | $size | $arch |"
          ' _ {} \; >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Installation Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debian/Ubuntu:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'wget <deb-package-url>' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dpkg -i pg-plansight*.deb' >> $GITHUB_STEP_SUMMARY
          echo 'sudo apt-get install -f  # Fix dependencies if needed' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RHEL/Fedora/CentOS:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'wget <rpm-package-url>' >> $GITHUB_STEP_SUMMARY
          echo 'sudo rpm -i pg-plansight*.rpm' >> $GITHUB_STEP_SUMMARY
          echo '# or' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dnf install pg-plansight*.rpm' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
