name: Release Packages (DEB & RPM)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; create-release re-grants contents: write.
permissions:
  contents: read

jobs:
  # Gate the whole release on a green tree. This workflow triggers on tag push
  # and has no dependency on ci.yml, so without this job, tagging a red branch
  # builds and publishes a release from untested code.
  verify:
    name: Verify (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

  build-packages:
    name: Build Packages
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Packages are versioned from Cargo.toml, so a tag that doesn't match
      # would publish artifacts under the wrong version. (Runs after the
      # toolchain install: cargo metadata needs cargo.)
      - name: Verify tag matches crate versions (CLI + extension, lockstep)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pg-plansight") | .version')
          ext_version=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path crates/pg_extension/Cargo.toml \
            | jq -r '.packages[] | select(.name == "pg_plansight") | .version')
          if [ "$tag" != "$cli_version" ]; then
            echo "Tag v$tag does not match pg-plansight version $cli_version" >&2
            exit 1
          fi
          if [ "$tag" != "$ext_version" ]; then
            echo "Tag v$tag does not match pg_plansight extension version $ext_version" >&2
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm@0.19.0

      - name: Install just
        uses: extractions/setup-just@v4

      # PLANSIGHT_USE_CROSS routes x86_64 through the same containerised
      # sysroot as the three cross targets. Built natively on this runner, the
      # amd64 binaries link against its glibc — v0.1.0 shipped an amd64 .deb
      # requiring libc6 >= 2.39, which dpkg refuses to install on Debian 12,
      # Ubuntu 22.04 or RHEL 9.
      - name: Build packages for ${{ matrix.target }}
        env:
          PLANSIGHT_USE_CROSS: "1"
        run: just build-all ${{ matrix.target }}

      - name: Validate packages
        run: |
          just validate-deb ${{ matrix.target }}
          just validate-rpm ${{ matrix.target }}

      # The crate manifests declare a fixed `libc6 (>= 2.28)` instead of letting
      # dpkg-shlibdeps guess it (which is what got every v0.1.0 architecture
      # wrong). A fixed floor is only safe if something checks it against the
      # binary that actually ships.
      - name: Verify the shipped binaries match the declared glibc floor
        run: just validate-glibc ${{ matrix.target }}

      - name: Upload DEB packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb
          retention-days: 30

      - name: Upload RPM packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-packages-${{ matrix.target }}
          path: target/${{ matrix.target }}/generate-rpm/*.rpm
          retention-days: 30

  build-extension-packages:
    name: Build Extension (PG ${{ matrix.pg }}, ${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18]
        arch: [x86_64, arm64]
        include:
          # ubuntu-22.04, not ubuntu-latest. The extension .so is built
          # natively against each major's server headers, so it cannot go
          # through `cross` the way the CLI binaries do — its glibc floor is
          # whatever the runner has. On ubuntu-latest that was 2.38 (gcc-14
          # emits a strong `__isoc23_sscanf` when compiling src/nesting.c), and
          # since the package declared no libc dependency, dpkg installed it on
          # Debian 12 and the module then failed to load — which, preloaded,
          # stops the cluster from starting. jammy (glibc 2.35, gcc 11)
          # measures at a 2.34 floor and carries PGDG packages for all six
          # majors.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Add the PGDG apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common curl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y

      - name: Install PostgreSQL ${{ matrix.pg }} + dev headers
        run: |
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libclang-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pg_extension
          key: pg${{ matrix.pg }}-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --locked --version "=0.19.1"

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm@0.19.0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Initialize pgrx against the system PostgreSQL
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Build & package extension (deb + rpm)
        run: |
          just ext-build ${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          cd crates/pg_extension
          cargo deb --no-build --variant pg${{ matrix.pg }}
          cargo generate-rpm --variant pg${{ matrix.pg }} --auto-req disabled

      # Same assertion the CLI packages get: the declared floor is a literal in
      # Cargo.toml, so something has to check it against the .so that ships.
      - name: Verify the extension module matches its declared glibc floor
        run: just validate-glibc-ext

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ext-deb-${{ matrix.arch }}-pg${{ matrix.pg }}
          path: crates/pg_extension/target/debian/*.deb
          retention-days: 30

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: ext-rpm-${{ matrix.arch }}-pg${{ matrix.pg }}
          path: crates/pg_extension/target/generate-rpm/*.rpm
          retention-days: 30

  test-extension-deb:
    name: Test Extension DEB (PG ${{ matrix.pg }}, ${{ matrix.arch }})
    needs: build-extension-packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18]
        # Both published architectures are installed into a real cluster. The
        # arm64 extension packages were previously built and released without
        # anything ever loading them.
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Download extension DEB (${{ matrix.arch }})
        uses: actions/download-artifact@v8
        with:
          name: ext-deb-${{ matrix.arch }}-pg${{ matrix.pg }}
          path: pkg

      - name: Install into a real PostgreSQL ${{ matrix.pg }} and load the extension
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres "postgres:${{ matrix.pg }}"
          # Wait for the server to accept connections (bounded).
          for _ in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec pg pg_isready -U postgres
          deb=$(ls pkg/*.deb | head -1)
          echo "Installing $deb"
          docker cp "$deb" pg:/tmp/ext.deb
          # dpkg first; apt -f resolves the postgresql-NN dependency if needed
          # (it is already present in the official image, so this is a no-op).
          docker exec pg bash -c 'apt-get update -qq && (dpkg -i /tmp/ext.deb || apt-get install -f -y)'
          docker exec pg psql -U postgres -c 'CREATE EXTENSION pg_plansight;'
          docker exec pg psql -U postgres -c 'SELECT * FROM plansight_check();'
          docker rm -f pg

  create-release:
    name: Create Release
    # Must depend on every install test, not just the extension one. Previously
    # test-deb-packages / test-rpm-packages were absent here (only the cosmetic
    # package-summary job depended on them), so a package that failed to install
    # was published to the release anyway.
    needs:
      - build-packages
      - build-extension-packages
      - test-extension-deb
      - test-deb-packages
      - test-rpm-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Publishing a release + uploading assets needs write access to repo
    # contents; the default GITHUB_TOKEN is read-only, which 403s action-gh-release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Organize packages
        run: |
          mkdir -p release-packages
          find packages -name "*.deb" -exec cp {} release-packages/ \;
          find packages -name "*.rpm" -exec cp {} release-packages/ \;
          ls -la release-packages/

      # Without this there is no integrity story at all for a
      # wget-then-dpkg-i install, and DEVELOPMENT.md already claimed releases
      # carried checksums.
      - name: Generate checksums
        working-directory: release-packages
        run: |
          set -euo pipefail
          sha256sum -- *.deb *.rpm > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Verify what we just wrote, so a corrupted artifact download fails
          # here rather than on a user's machine.
          sha256sum --check --strict SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # arm64 is install-tested, not just built. Until now this matrix held x86_64
  # alone, which is how v0.1.0 shipped arm64/armhf packages carrying no libc
  # dependency at all and an i386 package that named amd64-multilib libraries.
  test-deb-packages:
    name: Test DEB Package Installation (${{ matrix.target }})
    needs: build-packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            debarch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            debarch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Download DEB packages
        uses: actions/download-artifact@v8
        with:
          name: deb-packages-${{ matrix.target }}
          path: packages

      - name: Test DEB package installation
        run: |
          echo "Testing DEB package installation..."
          ls -la packages/

          # Reproduce a minimised system before installing. Every Ubuntu
          # container image ships this exclusion by default, and it silently
          # stripped the config template the postinst installs as the default
          # configuration — the package installed cleanly and the service had
          # nothing to start from. The runner itself is not minimised, so
          # without this the job cannot see that class of bug.
          sudo tee /etc/dpkg/dpkg.cfg.d/99-plansight-ci-exclude-docs >/dev/null <<'EOF'
          path-exclude=/usr/share/doc/*
          path-include=/usr/share/doc/*/copyright
          EOF

          # Install packages
          for deb in packages/*.deb; do
            echo "Installing $deb..."
            sudo dpkg -i "$deb"
          done

          # Test binaries exist and run
          echo "Testing installed binaries..."
          pg-plansight --version
          pg-plansight-exporter --version

          # Check systemd service file exists
          echo "Checking systemd service..."
          test -f /lib/systemd/system/pg-plansight-exporter.service || test -f /usr/lib/systemd/system/pg-plansight-exporter.service

          # Test configuration directory exists
          echo "Checking configuration..."
          test -d /etc/pg-plansight-exporter

          echo "DEB installation test completed!"

      # The unit file, the postinst-installed config, and the RPM/DEB scriptlets
      # are executed by systemd and dpkg — never by cargo — so nothing else in
      # CI covers them. Actually starting the service is what catches a config
      # that does not deserialize, an ExecStart the CLI rejects, and a unit
      # systemd refuses to load.
      - name: Verify the shipped unit file is valid
        run: |
          set -euo pipefail
          unit=$(ls /lib/systemd/system/pg-plansight-exporter.service \
                    /usr/lib/systemd/system/pg-plansight-exporter.service 2>/dev/null | head -1)
          echo "Verifying $unit"
          # systemd-analyze exits 0 on unknown keys, so grep the output too.
          output=$(systemd-analyze verify "$unit" 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -qi "Unknown key name"; then
            echo "::error::shipped unit contains directives systemd ignores"
            exit 1
          fi

      - name: Verify the installed config parses
        run: |
          set -euo pipefail
          # postinst leaves /etc/pg-plansight-exporter as 0750 root:pg-plansight
          # and the runner user is in neither, so every read of it needs sudo —
          # without it `test -f` returns 1 and `set -e` kills the job even
          # though the install was perfect.
          sudo test -f /etc/pg-plansight-exporter/config.toml
          echo "--- installed config ---"
          sudo cat /etc/pg-plansight-exporter/config.toml
          # `state show` loads and validates the config without starting the daemon.
          sudo -u pg-plansight pg-plansight-exporter \
            --config /etc/pg-plansight-exporter/config.toml \
            --state-db /tmp/ci-state.db state init

      # The real upgrade path, run against the package users actually have.
      #
      # A synthetic same-version reinstall cannot test this: dpkg runs the OLD
      # package's prerm, so only a genuine v0.1.0 -> 0.2.0 upgrade exercises
      # v0.1.0's stop+disable and the migration in the new postinst that undoes
      # it. It is also the only way to get the real unusable config v0.1.0
      # generated ([logs]/[database] — sections that were never in the schema)
      # rather than a hand-written imitation of it. None of this code is
      # reachable from the cargo test suite.
      - name: Upgrade from the released v0.1.0
        run: |
          set -euo pipefail
          base=https://github.com/egeapak/pg-plansight/releases/download/v0.1.0
          old=pg-plansight-exporter_0.1.0-1_${{ matrix.debarch }}.deb
          curl --fail --silent --show-error --location -o "/tmp/$old" "$base/$old"

          echo "--- installing v0.1.0 over a clean slate ---"
          sudo systemctl stop pg-plansight-exporter.service || true
          sudo apt-get purge -y pg-plansight-exporter
          sudo dpkg -i "/tmp/$old" || sudo apt-get install -f -y

          # Reproducing the real starting state matters: if v0.1.0's config ever
          # became loadable this assertion tells us, instead of the upgrade test
          # quietly passing against nothing.
          echo "--- v0.1.0 state (its config is expected NOT to parse) ---"
          sudo cat /etc/pg-plansight-exporter/config.toml
          if sudo -u pg-plansight pg-plansight-exporter \
               --config /etc/pg-plansight-exporter/config.toml check-config >/dev/null 2>&1; then
            echo "::error::v0.1.0's config parses — this test is no longer reproducing the real upgrade"
            exit 1
          fi

          echo "--- upgrading to this build ---"
          for deb in packages/pg-plansight-exporter*.deb; do sudo dpkg -i "$deb"; done

          echo "--- config after the upgrade ---"
          sudo cat /etc/pg-plansight-exporter/config.toml
          if ! sudo sh -c 'ls /etc/pg-plansight-exporter/config.toml.unusable-* >/dev/null 2>&1'; then
            echo "::error::postinst did not move the unusable config aside"
            exit 1
          fi
          if sudo grep -q '^\[database\]' /etc/pg-plansight-exporter/config.toml; then
            echo "::error::postinst left the unusable config in place"
            exit 1
          fi
          sudo -u pg-plansight pg-plansight-exporter \
            --config /etc/pg-plansight-exporter/config.toml \
            --state-db /tmp/ci-state-upgrade.db check-config

          # v0.1.0's prerm stops and disables the unit on its way out and dpkg
          # runs it after this package is unpacked, so the new postinst has to
          # put both back. Getting this wrong silently ends monitoring.
          sleep 2
          if ! systemctl is-enabled --quiet pg-plansight-exporter.service; then
            echo "::error::the unit is disabled after upgrading from v0.1.0"
            exit 1
          fi
          if ! systemctl is-active --quiet pg-plansight-exporter.service; then
            echo "::error::the service is not running after upgrading from v0.1.0"
            sudo systemctl status pg-plansight-exporter.service --no-pager || true
            sudo journalctl -u pg-plansight-exporter.service --no-pager -n 50 || true
            exit 1
          fi

          # A config this version accepts must survive the next configure
          # byte-for-byte, and must not accumulate another backup.
          before=$(sudo md5sum /etc/pg-plansight-exporter/config.toml | cut -d' ' -f1)
          backups=$(sudo sh -c 'ls /etc/pg-plansight-exporter/config.toml.unusable-* | wc -l')
          for deb in packages/pg-plansight-exporter*.deb; do sudo dpkg -i "$deb"; done
          after=$(sudo md5sum /etc/pg-plansight-exporter/config.toml | cut -d' ' -f1)
          backups_after=$(sudo sh -c 'ls /etc/pg-plansight-exporter/config.toml.unusable-* | wc -l')
          if [ "$before" != "$after" ]; then
            echo "::error::postinst rewrote a config it had already accepted"
            exit 1
          fi
          if [ "$backups" != "$backups_after" ]; then
            echo "::error::postinst backed up a config it had already accepted"
            exit 1
          fi
          sudo sh -c 'rm -f /etc/pg-plansight-exporter/config.toml.unusable-*'

      - name: Start the service and scrape it
        run: |
          set -euo pipefail
          sudo systemctl daemon-reload
          sudo systemctl start pg-plansight-exporter.service

          # Give it a moment, then require it to still be running.
          for _ in $(seq 1 15); do
            if systemctl is-active --quiet pg-plansight-exporter.service; then break; fi
            sleep 1
          done

          if ! systemctl is-active --quiet pg-plansight-exporter.service; then
            echo "::error::pg-plansight-exporter failed to start"
            sudo systemctl status pg-plansight-exporter.service --no-pager || true
            sudo journalctl -u pg-plansight-exporter.service --no-pager -n 100 || true
            exit 1
          fi

          echo "Service is active; scraping /metrics..."
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:9090/metrics > /tmp/metrics.txt
          head -20 /tmp/metrics.txt

          # An upgrade must not take monitoring down. Before this was fixed,
          # prerm stopped AND disabled the unit on `upgrade` and postinst only
          # ran `enable`, so every package upgrade left the exporter stopped
          # until somebody noticed. Reinstall over the running service and
          # require it to still be up, still enabled, and running the new
          # binary. This needs a real systemd, which the RPM job (a container)
          # does not have.
          echo "Checking the service survives a package upgrade..."
          for deb in packages/pg-plansight-exporter*.deb; do sudo dpkg -i "$deb"; done
          sleep 2
          if ! systemctl is-active --quiet pg-plansight-exporter.service; then
            echo "::error::the service was left stopped by a package upgrade"
            sudo systemctl status pg-plansight-exporter.service --no-pager || true
            sudo journalctl -u pg-plansight-exporter.service --no-pager -n 50 || true
            exit 1
          fi
          if ! systemctl is-enabled --quiet pg-plansight-exporter.service; then
            echo "::error::the service was left disabled by a package upgrade"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:9090/metrics >/dev/null
          echo "Service survived the upgrade and is still serving metrics."

          # A deliberately stopped service must stay stopped: try-restart, not
          # restart. An upgrade is not permission to start something the
          # operator turned off.
          echo "Checking an upgrade does not start a stopped service..."
          sudo systemctl stop pg-plansight-exporter.service
          for deb in packages/pg-plansight-exporter*.deb; do sudo dpkg -i "$deb"; done
          sleep 2
          if systemctl is-active --quiet pg-plansight-exporter.service; then
            echo "::error::a package upgrade started a service the operator had stopped"
            exit 1
          fi
          # Bring it back up for the SIGTERM check below, and assert it — an
          # unasserted wait loop would let a failed start through and leave the
          # graceful-shutdown check testing nothing.
          sudo systemctl start pg-plansight-exporter.service
          for _ in $(seq 1 15); do
            if systemctl is-active --quiet pg-plansight-exporter.service; then break; fi
            sleep 1
          done
          if ! systemctl is-active --quiet pg-plansight-exporter.service; then
            echo "::error::could not restart the service after the upgrade checks"
            sudo journalctl -u pg-plansight-exporter.service --no-pager -n 50 || true
            exit 1
          fi

          echo "Checking graceful shutdown on SIGTERM..."
          sudo systemctl stop pg-plansight-exporter.service
          # A daemon with no SIGTERM handler is SIGKILLed after TimeoutStopSec;
          # systemd records that as a failed stop.
          # Written to a file rather than piped into grep. Under `pipefail`,
          # `grep -q` exits at the first match and closes the pipe; journalctl
          # then dies of SIGPIPE (141), pipefail propagates 141 as the pipeline
          # status, and the `if` evaluates false — so the check could never
          # fire once the journal outgrew the pipe buffer, which the extra
          # start/stop cycles above make likely.
          sudo journalctl -u pg-plansight-exporter.service --no-pager > /tmp/exporter-journal.txt
          if grep -qi "state 'stop-sigterm' timed out" /tmp/exporter-journal.txt; then
            echo "::error::daemon did not handle SIGTERM; systemd had to SIGKILL it"
            exit 1
          fi

  test-rpm-packages:
    name: Test RPM Package Installation (${{ matrix.target }})
    needs: build-packages
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y rpm dpkg systemd

      - name: Download RPM packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-packages-${{ matrix.target }}
          path: packages

      - name: Test RPM package installation
        run: |
          echo "Testing RPM package installation..."
          ls -la packages/

          set -euo pipefail

          # Install packages. This must NOT be `|| true`: swallowing the exit
          # code is what hid the fact that the RPM's maintainer scriptlets were
          # never wired into [package.metadata.generate-rpm] at all.
          for rpm in packages/*.rpm; do
            echo "Installing $rpm..."
            rpm -i "$rpm"
          done

          # Test binaries
          echo "Testing installed binaries..."
          /usr/bin/pg-plansight --version
          /usr/bin/pg-plansight-exporter --version

          # Check systemd service file
          echo "Checking systemd service file..."
          test -f /usr/lib/systemd/system/pg-plansight-exporter.service
          cat /usr/lib/systemd/system/pg-plansight-exporter.service

      # Mirror the DEB assertions: prove the scriptlets actually ran. Without
      # them the RPM installs a unit that specifies User=pg-plansight while
      # creating neither the user nor the config it points at.
      - name: Verify RPM scriptlets ran
        run: |
          set -euo pipefail

          echo "Checking pg-plansight user/group exist..."
          getent group pg-plansight
          getent passwd pg-plansight

          echo "Checking directories..."
          test -d /etc/pg-plansight-exporter
          test -d /var/lib/pg-plansight-exporter

          echo "Checking the default config was installed and parses..."
          test -f /etc/pg-plansight-exporter/config.toml
          cat /etc/pg-plansight-exporter/config.toml
          /usr/bin/pg-plansight-exporter \
            --config /etc/pg-plansight-exporter/config.toml \
            --state-db /tmp/ci-state.db state init

      # Same repair path as the DEB job. rpm preserves an edited config across
      # upgrades too, so the unusable file v0.1.0 wrote survives here as well.
      - name: Repair an unusable config inherited from v0.1.0
        run: |
          set -euo pipefail
          cat > /etc/pg-plansight-exporter/config.toml <<'EOF'
          [server]
          bind_address = "127.0.0.1:9187"

          [logs]
          paths = ["/var/log/postgresql/*.log"]
          poll_interval_seconds = 30

          [database]
          retention_days = 30
          EOF

          # --force so the scriptlets re-run for the version already installed.
          rpm -U --force packages/pg-plansight-exporter*.rpm

          echo "--- config after reinstall ---"
          cat /etc/pg-plansight-exporter/config.toml

          if ! ls /etc/pg-plansight-exporter/config.toml.unusable-* >/dev/null 2>&1; then
            echo "::error::post-install scriptlet did not move the unusable config aside"
            exit 1
          fi
          if grep -q '^\[database\]' /etc/pg-plansight-exporter/config.toml; then
            echo "::error::post-install scriptlet left the unusable config in place"
            exit 1
          fi
          /usr/bin/pg-plansight-exporter \
            --config /etc/pg-plansight-exporter/config.toml \
            --state-db /tmp/ci-state-repair.db check-config
          rm -f /etc/pg-plansight-exporter/config.toml.unusable-*

      - name: Verify the shipped unit file is valid
        run: |
          set -euo pipefail
          output=$(systemd-analyze verify \
            /usr/lib/systemd/system/pg-plansight-exporter.service 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -qi "Unknown key name"; then
            echo "::error::shipped unit contains directives systemd ignores"
            exit 1
          fi

  package-summary:
    name: Package Build Summary
    needs: [build-packages, test-deb-packages, test-rpm-packages, build-extension-packages, test-extension-deb]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download all DEB artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*deb-*'
          path: deb-packages
          merge-multiple: true

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*rpm-*'
          path: rpm-packages
          merge-multiple: true

      - name: Generate package summary
        run: |
          echo "# Package Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## DEB Packages (Debian/Ubuntu)" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size | Architecture |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------------|" >> $GITHUB_STEP_SUMMARY

          find deb-packages -name "*.deb" -exec sh -c '
            package=$(basename "$1")
            size=$(du -h "$1" | cut -f1)
            arch=$(echo "$package" | grep -o "_[^_]*\.deb$" | sed "s/_\|\.deb//g")
            echo "| $package | $size | $arch |"
          ' _ {} \; >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## RPM Packages (RHEL/Fedora/CentOS)" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size | Architecture |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------------|" >> $GITHUB_STEP_SUMMARY

          find rpm-packages -name "*.rpm" -exec sh -c '
            package=$(basename "$1")
            size=$(du -h "$1" | cut -f1)
            arch=$(echo "$package" | grep -o "\.[^.]*\.rpm$" | sed "s/\.\|rpm//g")
            echo "| $package | $size | $arch |"
          ' _ {} \; >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Installation Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debian/Ubuntu:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'wget <deb-package-url>' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dpkg -i pg-plansight*.deb' >> $GITHUB_STEP_SUMMARY
          echo 'sudo apt-get install -f  # Fix dependencies if needed' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RHEL/Fedora/CentOS:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'wget <rpm-package-url>' >> $GITHUB_STEP_SUMMARY
          echo 'sudo rpm -i pg-plansight*.rpm' >> $GITHUB_STEP_SUMMARY
          echo '# or' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dnf install pg-plansight*.rpm' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
