name: version & changelog

# Guards the release invariant that the tag-time check in packages.yml assumes:
# all published crates share one version (lockstep), and CHANGELOG.md has an
# entry for it. Runs on every PR/push so a version bump without a matching
# changelog entry (or a crate left behind) fails fast, long before a tag.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Least privilege: none of these jobs write to the repository. The default
# token scope is repository-wide, so it has to be narrowed explicitly.
permissions:
  contents: read

jobs:
  consistency:
    name: Version + changelog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Crate versions in lockstep + CHANGELOG has an entry
        # bash explicitly: the upgrade-script check below uses `compgen`, which
        # dash does not have. GitHub's default shell is already bash, but the
        # dependency is easy to break silently otherwise.
        shell: bash
        run: |
          set -euo pipefail
          ver() { grep -m1 '^version = ' "$1" | sed -E 's/.*"([^"]+)".*/\1/'; }
          cli=$(ver crates/tui/Cargo.toml)
          core=$(ver crates/core/Cargo.toml)
          exporter=$(ver crates/exporter/Cargo.toml)
          ext=$(ver crates/pg_extension/Cargo.toml)
          echo "pg-plansight=$cli  pg-plansight-core=$core  pg-plansight-exporter=$exporter  pg_plansight=$ext"

          fail=0
          for pair in "pg-plansight-core:$core" "pg-plansight-exporter:$exporter" "pg_plansight:$ext"; do
            name=${pair%%:*}; v=${pair#*:}
            if [ "$v" != "$cli" ]; then
              echo "::error::version mismatch: $name=$v != pg-plansight=$cli — the CLI and extension crates must move in lockstep (see packages.yml tag check)."
              fail=1
            fi
          done

          if ! grep -qE "^## \[${cli//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$cli]' section for the current crate version. Add the release section (generate it with git-cliff — see cliff.toml) before bumping the version."
            fail=1
          fi

          # Every version after the first must be reachable by ALTER EXTENSION
          # ... UPDATE. `default_version` in pg_plansight.control tracks the
          # crate version, so bumping it without shipping
          # sql/pg_plansight--<old>--<new>.sql strands every installed cluster
          # on "extension pg_plansight has no update path from version X to
          # version Y" — recoverable only by DROP EXTENSION, which discards all
          # captured statistics. The script may be empty when the SQL surface
          # did not change; it just has to exist. cargo-pgrx copies anything
          # matching that name into the cluster's extension directory.
          if [ "$cli" != "0.1.0" ]; then
            # shellcheck disable=SC2086
            if ! compgen -G "crates/pg_extension/sql/pg_plansight--*--$cli.sql" > /dev/null; then
              echo "::error::no upgrade script targets pg_plansight $cli. Add crates/pg_extension/sql/pg_plansight--<previous version>--$cli.sql (an empty, comment-only file is fine when no SQL object changed)."
              fail=1
            fi
          fi

          # cargo-pgrx must match the `pgrx` crate requirement exactly — it
          # refuses to build a crate pinned to a different pgrx. The pin is
          # repeated in two workflows, three Dockerfiles and two docs pages,
          # and the Dockerfiles had already drifted to 0.18.1 while the crate
          # moved to 0.19.1, quietly breaking `just ext-package-cross` and the
          # bench harness. No CI job builds those files, so only this catches it.
          pgrx_req=$(sed -n 's/^pgrx = "=\([0-9][0-9.]*\)".*/\1/p' \
            crates/pg_extension/Cargo.toml | head -1)
          if [ -z "$pgrx_req" ]; then
            echo "::error::could not read the pgrx version from crates/pg_extension/Cargo.toml"
            fail=1
          else
            echo "pgrx requirement: $pgrx_req"
            # `|| true`: grep exits 1 on no match, and an empty result is its
            # own error below rather than a silent pass. Without the guard the
            # loop ran once on a blank line and reported a pin of "" in a file
            # of "".
            pgrx_pins=$(grep -rn --exclude=version-check.yml \
              'cargo install cargo-pgrx --locked --version' \
              .github/workflows crates/pg_extension/docker docs || true)
            if [ -z "$pgrx_pins" ]; then
              echo "::error::found no cargo-pgrx install commands to check — has the layout moved? This check is silently useless if so."
              fail=1
            else
              while IFS= read -r hit; do
                [ -n "$hit" ] || continue
                file=${hit%%:*}
                pinned=$(printf '%s\n' "$hit" \
                  | sed -n 's/.*--version "\?=\?\([0-9][0-9.]*\)"\?.*/\1/p')
                if [ "$pinned" != "$pgrx_req" ]; then
                  echo "::error file=$file::installs cargo-pgrx ${pinned:-<unparsed>} but the extension requires pgrx $pgrx_req — cargo-pgrx must match the crate exactly."
                  fail=1
                  continue
                fi
                # An exact `=` matters as much as the number. `--version 0.19.1`
                # is a caret requirement, so the moment 0.19.2 is published a
                # reader following these instructions gets a cargo-pgrx that
                # refuses to build a crate pinned to =0.19.1.
                case "$hit" in
                  *'--version "='*|*'--version ='*) ;;
                  *)
                    echo "::error file=$file::pins cargo-pgrx $pinned without '=', which is a caret requirement — use \"=$pgrx_req\"."
                    fail=1
                    ;;
                esac
              done <<EOF
          $pgrx_pins
          EOF
            fi
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: all crates at $cli, CHANGELOG.md has a [$cli] section, and every cargo-pgrx pin is $pgrx_req."
