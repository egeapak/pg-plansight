name: pgrx extension

# The pg_plansight extension is its own workspace (it needs the pgrx toolchain
# and a pgNN feature), so it has a dedicated job separate from the main CI gate.
on:
  push:
    branches: [main, master]
    paths:
      - "crates/pg_extension/**"
      - "crates/core/**"
      # core's dependency versions resolve from the root workspace manifest,
      # so a root bump changes the extension's build too.
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pgrx.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "crates/pg_extension/**"
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pgrx.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    # PG19 is still in development, so it runs as an allowed failure (it depends
    # on PGDG shipping an installable postgresql-19 package): it reports pass/fail
    # without gating the workflow. The released majors stay required.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Full range supported by pgrx 0.19 (PG13 is the oldest; the hook code is
        # cfg-gated for InstrAlloc's PG13 two-arg form, EnableQueryId on PG16+).
        pg: [13, 14, 15, 16, 17, 18]
        include:
          # PG19: not yet GA — exercised best-effort (see continue-on-error above).
          - pg: 19
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - name: Add the PGDG apt repository
        # Ensures every major (13-18) is installable, not just the one shipped
        # with the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common curl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y

      - name: Install PostgreSQL ${{ matrix.pg }} + dev headers
        run: |
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libclang-dev clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pg_extension
          cache-on-failure: true

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --locked --version "=0.19.1"

      - name: Initialize pgrx against the system PostgreSQL
        # Use the explicit per-version pg_config, not the postgresql-common
        # wrapper in PATH, which can resolve to a different major.
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Grant write access to the extension install dirs
        # `cargo pgrx test` runs `cargo pgrx install` (no sudo), which copies the
        # .so into $pkglibdir and the control/SQL into $sharedir/extension. On the
        # runner those are root-owned system dirs, so the install fails with
        # "Permission denied"; the first #[pg_test] then hard-aborts while holding
        # the pgrx framework mutex and every remaining test cascades into "Could
        # not obtain test mutex". Hand the two dirs to the runner user up front.
        # Paths come from pg_config so they track the packaged layout exactly.
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo chown -R "$(id -u):$(id -g)" \
            "$("$PG_CONFIG" --pkglibdir)" \
            "$("$PG_CONFIG" --sharedir)/extension"

      - name: Format check
        working-directory: crates/pg_extension
        run: cargo fmt --check

      - name: Clippy
        working-directory: crates/pg_extension
        run: cargo clippy --no-default-features --features pg${{ matrix.pg }} -- -D warnings

      # The GitHub runner user is non-root, so initdb/postgres (which refuse to
      # run as root) work here.
      - name: Run pgrx tests
        working-directory: crates/pg_extension
        # Serialize: the #[pg_test]s share one database and the capture shmem
        # ring, so parallel execution can deadlock on plansight.statements locks.
        env:
          RUST_TEST_THREADS: "1"
        run: cargo pgrx test pg${{ matrix.pg }}
