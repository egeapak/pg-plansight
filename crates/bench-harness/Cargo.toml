[package]
name = "pg-plansight-bench-harness"
version = "0.1.0"
edition = "2021"
description = "Cross-version throughput/overhead benchmarking harness for the pg_plansight extension"
license = "MIT"
publish = false

# Cross-version throughput/overhead harness for the pg_plansight extension.
# Spins a postgres container (built with the extension via Dockerfile.bench) with
# testcontainers, then measures baseline-vs-hook latency and high-throughput TPS.
# Not part of the default build path; run explicitly (needs Docker).

[dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
postgres = "0.19"
anyhow = "1"
