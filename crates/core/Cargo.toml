[package]
name = "pg-plansight-core"
version = "0.1.0"
edition = "2024"
description = "Core parsing functionality for PostgreSQL auto_explain logs"
license = "MIT"
authors = ["Ege Apak <ege@apak.dev>"]
homepage = "https://github.com/egeapak/pg-plansight"
repository = "https://github.com/egeapak/pg-plansight"
rust-version = "1.96"
keywords = ["postgresql", "auto-explain", "query-plan", "parser", "performance"]
categories = ["database", "parser-implementations"]

[dependencies]
anyhow = { workspace = true }
bzip2 = { workspace = true, optional = true }
chrono = { workspace = true }
flate2 = { workspace = true, optional = true }
hashbrown = { workspace = true }
hostname = { version = "0.4", optional = true }
once_cell = { workspace = true }
rayon = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true, features = ["visitor"] }
statrs = { workspace = true, optional = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[features]
# Default preserves the full CLI/TUI/exporter behaviour.
default = ["parallel", "file-io", "regression-analysis"]
# Statistical (statrs-backed) regression detection. Disable to drop the `statrs`
# dependency for embeds (e.g. the Postgres extension); the basic heuristic
# regression engine remains available without it.
regression-analysis = ["dep:statrs"]
# Thread-based parallel grouping and multi-file parsing (rayon). Disable for
# single-threaded embeds such as a Postgres backend, where spawning threads
# that touch backend state is unsafe.
parallel = ["dep:rayon", "hashbrown/rayon"]
# Filesystem reading, gzip/bzip2 decompression, path expansion, JSON file
# export/import, and hostname capture. Disable to embed the parser without an
# I/O surface (input is fed in-memory).
file-io = ["dep:flate2", "dep:bzip2", "dep:hostname"]

[dev-dependencies]
approx = "0.5"
criterion = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }

[[bench]]
name = "log_parsing"
harness = false

[[bench]]
name = "grouping"
harness = false

