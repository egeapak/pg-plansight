[package]
name = "pg-loganalyze-exporter"
version = "0.1.0"
edition = "2024"
description = "Prometheus exporter for PostgreSQL auto_explain logs"
license = "MIT"
authors = ["Ege Apak <ege@apak.dev>"]
homepage = "https://github.com/egeapak/pg-loganalyze"
repository = "https://github.com/egeapak/pg-loganalyze"

[[bin]]
name = "pg-loganalyze-exporter"
path = "src/main.rs"

[dependencies]
# Core parsing functionality
pg-loganalyze-core = { path = "../core" }

# Prometheus (default feature)
prometheus = { version = "0.13", optional = true }
prometheus_push = { version = "0.4", optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

# OpenTelemetry
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"], optional = true }
opentelemetry-prometheus = { version = "0.27", optional = true }
tonic = { version = "0.12", optional = true }

# State persistence
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# Configuration and CLI
serde = { workspace = true }
toml = "0.8"
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }


# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }

# Time handling
chrono = { workspace = true }

# File globbing and regex
glob = "0.3"
regex = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
hashbrown = { workspace = true }
urlencoding = "2.1"
xxhash-rust = { workspace = true }

[features]
default = ["prometheus"]
prometheus = ["dep:prometheus", "dep:prometheus_push", "dep:axum", "dep:tower", "dep:tower-http"]
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tonic"]
otel-prometheus = ["opentelemetry", "dep:opentelemetry-prometheus"]

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.deb]
maintainer = "Ege Apak <ege@apak.dev>"
copyright = "2025, Ege Apak <ege@apak.dev>"
license-file = ["../../LICENSE", "0"]
extended-description = "A daemon service that continuously monitors PostgreSQL auto_explain logs and exports metrics to Prometheus. Includes state management, scheduling, and systemd integration for production deployments."
depends = "$auto, systemd"
section = "database"
priority = "optional"
assets = [
    ["build/release/pg-loganalyze-exporter", "usr/bin/", "755"],
    ["systemd/pg-loganalyze-exporter.service", "lib/systemd/system/", "644"],
    ["config/example.toml", "usr/share/doc/pg-loganalyze-exporter/example.toml", "644"],
    ["../../LICENSE", "usr/share/doc/pg-loganalyze-exporter/", "644"],
]
conf-files = ["/etc/pg-loganalyze-exporter/config.toml"]
maintainer-scripts = "debian/"

[package.metadata.generate-rpm]
summary = "PostgreSQL auto_explain log analyzer (Prometheus exporter)"
license = "MIT"
group = "Applications/System"
assets = [
    { source = "build/release/pg-loganalyze-exporter", dest = "/usr/bin/pg-loganalyze-exporter", mode = "755" },
    { source = "systemd/pg-loganalyze-exporter.service", dest = "/usr/lib/systemd/system/pg-loganalyze-exporter.service", mode = "644" },
    { source = "config/example.toml", dest = "/usr/share/doc/pg-loganalyze-exporter/example.toml", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/doc/pg-loganalyze-exporter/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
systemd = "*"