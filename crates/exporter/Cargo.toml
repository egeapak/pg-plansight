[package]
name = "pg-plansight-exporter"
version = "0.2.0"
edition = "2024"
description = "Prometheus exporter for PostgreSQL auto_explain logs"
license = "MIT"
authors = ["Ege Apak <ege@apak.dev>"]
homepage = "https://github.com/egeapak/pg-plansight"
repository = "https://github.com/egeapak/pg-plansight"
readme = "README.md"
rust-version = "1.96"
keywords = ["postgresql", "prometheus", "opentelemetry", "metrics", "auto-explain"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "pg-plansight-exporter"
path = "src/main.rs"

[dependencies]
# Core parsing functionality
# Version alongside the path so these crates are actually publishable:
# crates.io rejects path-only dependencies.
pg-plansight-core = { path = "../core", version = "0.2.0" }

# Prometheus (default feature)
prometheus = { version = "0.14", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = [
    "cors",
    "timeout",
    "limit",
], optional = true }

# OpenTelemetry
opentelemetry = { version = "0.32", optional = true }
# These features gate the async-runtime PeriodicReader (the module is behind
# `experimental_metrics_periodicreader_with_async_runtime`, which also pulls
# `experimental_async_runtime` for the runtime::Tokio type). It drives OTLP/gRPC
# export as tokio tasks; the default thread-based reader would block_on the tonic
# future off-runtime and panic with "no reactor running", silently dropping all
# metrics.
opentelemetry_sdk = { version = "0.32", features = [
    "rt-tokio",
    "experimental_metrics_periodicreader_with_async_runtime",
], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"], optional = true }
opentelemetry-prometheus = { version = "0.32", optional = true }
tonic = { version = "0.14", optional = true }

# State persistence. rusqlite 0.40's bundled libsqlite3-sys 0.38 uses the
# `cfg_select` macro, which is part of why the workspace MSRV is 1.96.
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }

# Configuration and CLI
serde = { workspace = true }
toml = "1.0"
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }


# Logging and error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }

# Time handling
chrono = { workspace = true }

# File globbing and regex
glob = "0.3"
regex = { workspace = true }
# Held at 0.12, not 0.13: 0.13 drops the `rustls-tls` feature, and its `rustls`
# feature switches trust roots to the OS store (rustls-platform-verifier) with no
# way to opt back into bundled roots — that would break the pushgateway's HTTPS
# in a container without a system CA bundle. 0.12 keeps `rustls-tls` =
# bundled Mozilla webpki-roots (same as the prior 0.11 client) on a modern
# hyper 1.x stack. (prometheus_push 0.4.5 pins reqwest ^0.12 to match.)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hashbrown = { workspace = true }
urlencoding = "2.1"
xxhash-rust = { workspace = true }

[features]
default = ["prometheus"]
prometheus = ["dep:prometheus", "dep:axum", "dep:tower", "dep:tower-http"]
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tonic"]
otel-prometheus = ["opentelemetry", "dep:opentelemetry-prometheus"]

[dev-dependencies]
flate2 = { workspace = true }
tempfile = { workspace = true }

[package.metadata.deb]
maintainer = "Ege Apak <ege@apak.dev>"
copyright = "2025, Ege Apak <ege@apak.dev>"
license-file = ["../../LICENSE", "0"]
extended-description = "A daemon service that continuously monitors PostgreSQL auto_explain logs and exports metrics to Prometheus. Includes state management, scheduling, and systemd integration for production deployments."
# Explicit, not `$auto`. `$auto` runs dpkg-shlibdeps, which answered wrongly on
# every architecture in v0.1.0:
#   * amd64  -> `libc6 (>= 2.39)`, because the release was built natively on the
#     Ubuntu 24.04 runner. That number was CORRECT and the package was right to
#     refuse Debian 12: the 2.39 references are weak `pidfd_*` probes, but GNU
#     ld still emits a `Flags: none` entry in `.gnu.version_r`, and ld.so
#     enforces those regardless of symbol binding -- the binary really does die
#     with "version `GLIBC_2.39' not found" on glibc 2.36. The bug was building
#     on a modern runner, not the dependency it produced.
#   * arm64/armhf -> no Depends field at all. The binaries are cross-built in a
#     container, so dpkg-shlibdeps had no target libraries to inspect and
#     emitted nothing; those packages installed on any glibc and then failed at
#     exec time.
#   * i386 -> `lib32gcc-s1, libc6-i386`, the amd64-multilib package names. A
#     native i386 system provides `libc6`/`libgcc-s1`, so that package was
#     uninstallable on the architecture it targets.
# Every target is now built through `cross` against one old sysroot (see
# `PLANSIGHT_USE_CROSS` in the justfile), so a single floor is correct for all
# four. The binaries actually need 2.18; 2.28 is the deliberately conservative
# floor documented in docs/INSTALLATION.md (Debian 10 / RHEL 8 -- note Ubuntu
# 18.04 is 2.27 and is NOT covered). `just validate-glibc` reads
# `.gnu.version_r` out of the shipped binaries and fails the release if they
# need more than this, and also checks that nothing outside libc6/libgcc-s1
# appears in DT_NEEDED -- a hand-written `depends` has no other guard.
# libgcc was renamed libgcc1 -> libgcc-s1 in gcc-10, so both spellings are
# accepted.
#
# `adduser` is listed because postinst calls addgroup/adduser under `set -e`.
# `$auto` never covered maintainer-script dependencies either, but nothing
# noticed while the packages were only installed on images that happened to
# carry it: adduser is Priority: important, absent from debian:13 and
# ubuntu:24.04, and its absence aborts postinst with exit 127 and leaves the
# package half-configured. `passwd` provides usermod (postinst's group
# additions, which are already `|| true`, but the dependency is still honest).
depends = "libc6 (>= 2.28), libgcc-s1 | libgcc1, adduser, passwd, systemd"
section = "database"
priority = "optional"
assets = [
    ["build/release/pg-plansight-exporter", "usr/bin/", "755"],
    ["systemd/pg-plansight-exporter.service", "lib/systemd/system/", "644"],
    # NOT under /usr/share/doc. The postinst installs this file as the default
    # configuration, and minimised systems routinely set
    # `path-exclude=/usr/share/doc/*` — every Ubuntu container image does by
    # default — which silently strips it, leaving a package that installs
    # cleanly with no config and a service that cannot start. Anything a
    # maintainer script needs at runtime has to live outside the doc tree.
    ["config/example.toml", "usr/share/pg-plansight-exporter/example.toml", "644"],
    ["../../LICENSE", "usr/share/doc/pg-plansight-exporter/", "644"],
]
# No `conf-files`. It used to name /etc/pg-plansight-exporter/config.toml,
# which the package does not ship -- postinst creates it. dpkg-deb refuses
# to build such a package ("conffile ... does not appear in package") and
# lintian reports E: missing-conffile; only cargo-deb's hand-rolled ar
# assembly let it exist. dpkg recorded a `newconffile` placeholder that never
# resolved, so the declaration bought nothing while setting a trap: adding the
# file to `assets` later would flip dpkg from "newconffile" straight to
# "locally modified" and prompt every user. The file stays postinst-managed,
# and postrm still removes it on purge.
maintainer-scripts = "debian/"

[package.metadata.generate-rpm]
summary = "Plansight: PostgreSQL query plan analyzer (Prometheus exporter)"
license = "MIT"
group = "Applications/System"
# Maintainer scriptlets. cargo-generate-rpm resolves each value as a path
# relative to this manifest's directory and *silently falls back to treating
# the value as inline script content* if the file is missing — so a typo here
# ships the literal string "rpm/..." as the scriptlet. `rpm_scriptlet_paths_exist`
# in src/config.rs guards against that.
# Without these keys the RPM created no user, no config, and never enabled the
# service, while still installing a unit that specifies User=pg-plansight.
pre_install_script = "rpm/pre_install_script"
post_install_script = "rpm/post_install_script"
pre_uninstall_script = "rpm/pre_uninstall_script"
post_uninstall_script = "rpm/post_uninstall_script"
# %posttrans belongs to the NEW package and is the last scriptlet rpm runs, so
# it is the only place that can restore a unit the OLD package's %preun
# stopped and disabled on its way out. See rpm/post_trans_script.
post_trans_script = "rpm/post_trans_script"
assets = [
    { source = "build/release/pg-plansight-exporter", dest = "/usr/bin/pg-plansight-exporter", mode = "755" },
    { source = "systemd/pg-plansight-exporter.service", dest = "/usr/lib/systemd/system/pg-plansight-exporter.service", mode = "644" },
    # Outside the doc tree, for the same reason as the DEB asset above:
    # `rpm --excludedocs` and minimised images strip /usr/share/doc.
    { source = "config/example.toml", dest = "/usr/share/pg-plansight-exporter/example.toml", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/doc/pg-plansight-exporter/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
# Mirrors the DEB floor. `--auto-req disabled` is unconditional (see the
# justfile), so without this the RPM declares no glibc requirement at all and
# installs onto a system it cannot run on -- docs/INSTALLATION.md says RHEL 7
# is unsupported, and this is what makes rpm enforce it.
glibc = ">= 2.28"
# %pre calls groupadd/useradd.
shadow-utils = "*"