[server]
bind_address = "0.0.0.0:9090"
metrics_path = "/metrics"

[log_parsing]
log_paths = ["/var/log/postgresql/*.log"]
poll_interval = "30s"                       # How often to check for new logs
batch_size = 1000                          # Queries per processing batch

[metrics]
# Prometheus settings
namespace = "pg_loganalyze" 
histogram_buckets = [0.001, 0.01, 0.1, 1.0, 5.0, 10.0, 30.0, 60.0, 300.0]
slow_query_thresholds = ["1s", "5s", "10s", "30s"]

# Data retention (for metric cleanup)
retain_days = 7                            # Only keep metrics for last N days

[state]
database_path = "/var/lib/pg-loganalyze-exporter/state.db"

[filters]
include_databases = ["production"]
min_duration_ms = 100
# exclude_query_patterns = ["^BEGIN$", "^COMMIT$", "^SET "]

# Example usage:
# 
# 1. Initialize state: pg-loganalyze-exporter state init --config config.toml
# 2. Process some files: pg-loganalyze-exporter process --logs "/var/log/old/*.log" --config config.toml
# 3. Later, process remaining content: pg-loganalyze-exporter process-rest --config config.toml
# 4. Or with specific files: pg-loganalyze-exporter process-rest --logs "/var/log/new/*.log" --config config.toml