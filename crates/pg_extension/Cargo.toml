[package]
name = "pg_plansight"
version = "0.2.0"
edition = "2021"
description = "PostgreSQL extension that captures cumulative auto_explain query statistics, queryable via SQL"
license = "MIT"
authors = ["Ege Apak <ege@apak.dev>"]
homepage = "https://github.com/egeapak/pg-plansight"
repository = "https://github.com/egeapak/pg-plansight"
readme = "README.md"
rust-version = "1.96"
keywords = ["postgresql", "pgrx", "extension", "query-stats", "auto-explain"]
categories = ["database"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Default targets the locally-initialized PostgreSQL (16). CI builds each
# supported major explicitly.
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
pgrx = "=0.19.1"
# Embeddable core: default-features off drops rayon (Postgres backends are
# single-threaded), the file-io surface (gzip/bzip2/path/hostname), and the
# statrs-backed statistical regression detector (`regression-analysis`) — none
# of which the in-backend capture path uses. sqlparser-based normalization and
# the plan analyzers stay on as pure-compute and safe inside a backend. The
# basic (no-statrs) regression engine remains available.
#
# NB: regex Unicode tables are deliberately NOT dropped. The patterns use
# `\d`/`\s`/`\w`, which the regex crate can only compile with `unicode-perl`;
# without it `Regex::new` returns Err and core's `LazyLock { …unwrap() }` would
# panic on the first parse inside a backend. (It saved ~0.5 MB but the failure
# is masked by every test config, since dev/build deps re-enable unicode-perl.)
pg-plansight-core = { path = "../core", default-features = false }
chrono = "0.4"
serde_json = "1.0"

[build-dependencies]
# Same resolver pgrx-pg-sys uses, so the C shim compiles against the very
# headers pgrx generated its bindings from.
pgrx-pg-config = "=0.19.1"
cc = "1"

[dev-dependencies.pgrx-tests]
version = "=0.19.1"

[profile.dev]
panic = "unwind"

# Size/perf tuning for the shipped .so:
# - panic = "unwind" is REQUIRED by pgrx (#[pg_guard] unwinds across the FFI
#   boundary into Postgres' error handling); panic = "abort" is not an option.
# - lto = "fat" + codegen-units = 1 let the linker dead-strip everything the
#   in-backend capture path never reaches (e.g. the unused statrs/regression and
#   file-io surface already dropped via default-features = false on core).
# - strip = "symbols" drops the static symbol/debug tables. The dynamic symbols
#   Postgres needs to load the module (Pg_magic_func, _PG_init, the pg_finfo_*
#   wrappers) live in .dynsym and are preserved, so the cluster still loads it.
[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# ---------------------------------------------------------------------------
# Packaging: one deb/rpm per PostgreSQL major, built from the `cargo pgrx
# package` staged tree (target/release/pg_plansight-pgNN/...). Drive via the
# `just ext-*` recipes; pick the major with `--variant pgNN`. The globbed
# assets pick up the .control, the install SQL, and any future
# `pg_plansight--<old>--<new>.sql` upgrade scripts automatically.
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Ege Apak <ege@apak.dev>"
copyright = "2025, Ege Apak"
license-file = ["../../LICENSE", "0"]
section = "database"
priority = "optional"
extended-description = """\
In-process cumulative query statistics (like pg_stat_statements) with \
auto_explain plan capture and analysis. One package per PostgreSQL major; \
installing drops the module + control/SQL into that cluster's directories. \
After install, restart PostgreSQL (it preloads a worker + hooks) and run \
CREATE EXTENSION pg_plansight."""

[package.metadata.deb.variants.pg13]
name = "postgresql-13-plansight"
depends = "postgresql-13, libc6 (>= 2.34)"
assets = [
    ["target/release/pg_plansight-pg13/usr/lib/postgresql/13/lib/pg_plansight.so", "/usr/lib/postgresql/13/lib/", "644"],
    ["target/release/pg_plansight-pg13/usr/share/postgresql/13/extension/*", "/usr/share/postgresql/13/extension/", "644"],
]

[package.metadata.deb.variants.pg14]
name = "postgresql-14-plansight"
depends = "postgresql-14, libc6 (>= 2.34)"
assets = [
    ["target/release/pg_plansight-pg14/usr/lib/postgresql/14/lib/pg_plansight.so", "/usr/lib/postgresql/14/lib/", "644"],
    ["target/release/pg_plansight-pg14/usr/share/postgresql/14/extension/*", "/usr/share/postgresql/14/extension/", "644"],
]

[package.metadata.deb.variants.pg15]
name = "postgresql-15-plansight"
depends = "postgresql-15, libc6 (>= 2.34)"
assets = [
    ["target/release/pg_plansight-pg15/usr/lib/postgresql/15/lib/pg_plansight.so", "/usr/lib/postgresql/15/lib/", "644"],
    ["target/release/pg_plansight-pg15/usr/share/postgresql/15/extension/*", "/usr/share/postgresql/15/extension/", "644"],
]

[package.metadata.deb.variants.pg16]
name = "postgresql-16-plansight"
depends = "postgresql-16, libc6 (>= 2.34)"
assets = [
    ["target/release/pg_plansight-pg16/usr/lib/postgresql/16/lib/pg_plansight.so", "/usr/lib/postgresql/16/lib/", "644"],
    ["target/release/pg_plansight-pg16/usr/share/postgresql/16/extension/*", "/usr/share/postgresql/16/extension/", "644"],
]

[package.metadata.deb.variants.pg17]
name = "postgresql-17-plansight"
depends = "postgresql-17, libc6 (>= 2.34)"
assets = [
    ["target/release/pg_plansight-pg17/usr/lib/postgresql/17/lib/pg_plansight.so", "/usr/lib/postgresql/17/lib/", "644"],
    ["target/release/pg_plansight-pg17/usr/share/postgresql/17/extension/*", "/usr/share/postgresql/17/extension/", "644"],
]

[package.metadata.deb.variants.pg18]
name = "postgresql-18-plansight"
depends = "postgresql-18, libc6 (>= 2.34)"
assets = [
    ["target/release/pg_plansight-pg18/usr/lib/postgresql/18/lib/pg_plansight.so", "/usr/lib/postgresql/18/lib/", "644"],
    ["target/release/pg_plansight-pg18/usr/share/postgresql/18/extension/*", "/usr/share/postgresql/18/extension/", "644"],
]

# The .so is built natively against each major's server headers, so unlike the
# CLI packages it cannot go through `cross` — its glibc floor is whatever the
# build runner has. v0.1.0 was built on ubuntu-latest and needed GLIBC_2.38
# (a strong `__isoc23_sscanf` from gcc-14 compiling src/nesting.c), while
# declaring no libc dependency at all: dpkg installed it happily on Debian 12
# and the module then failed to load with "version `GLIBC_2.38' not found" —
# which, with pg_plansight in shared_preload_libraries, means the cluster
# refuses to start. The release workflow now builds these on ubuntu-22.04
# (glibc 2.35, gcc 11), which measures at a 2.34 floor, and `just
# validate-glibc-ext` fails the build if the shipped .so needs more than the
# 2.34 declared here. That is a narrower range than the CLI packages' 2.28 —
# see docs/INSTALLATION.md.
[package.metadata.generate-rpm]
summary = "Cumulative PostgreSQL query statistics extension (auto_explain capture + analysis)"
license = "MIT"
group = "Applications/Databases"
# assets/name set per-variant below. RPM server package names vary by distro
# (postgresqlNN-server on PGDG, postgresql-server on base), so no hard Requires
# on the server is declared — install into an existing PostgreSQL NN cluster.
# glibc is declared, because nothing else stops the module being installed onto
# a system whose loader cannot resolve it.

[package.metadata.generate-rpm.requires]
glibc = ">= 2.34"

[package.metadata.generate-rpm.variants.pg13]
name = "plansight_13"
assets = [
    { source = "target/release/pg_plansight-pg13/usr/lib/postgresql/13/lib/pg_plansight.so", dest = "/usr/lib/postgresql/13/lib/pg_plansight.so", mode = "644" },
    { source = "target/release/pg_plansight-pg13/usr/share/postgresql/13/extension/*", dest = "/usr/share/postgresql/13/extension/", mode = "644" },
]

[package.metadata.generate-rpm.variants.pg14]
name = "plansight_14"
assets = [
    { source = "target/release/pg_plansight-pg14/usr/lib/postgresql/14/lib/pg_plansight.so", dest = "/usr/lib/postgresql/14/lib/pg_plansight.so", mode = "644" },
    { source = "target/release/pg_plansight-pg14/usr/share/postgresql/14/extension/*", dest = "/usr/share/postgresql/14/extension/", mode = "644" },
]

[package.metadata.generate-rpm.variants.pg15]
name = "plansight_15"
assets = [
    { source = "target/release/pg_plansight-pg15/usr/lib/postgresql/15/lib/pg_plansight.so", dest = "/usr/lib/postgresql/15/lib/pg_plansight.so", mode = "644" },
    { source = "target/release/pg_plansight-pg15/usr/share/postgresql/15/extension/*", dest = "/usr/share/postgresql/15/extension/", mode = "644" },
]

[package.metadata.generate-rpm.variants.pg16]
name = "plansight_16"
assets = [
    { source = "target/release/pg_plansight-pg16/usr/lib/postgresql/16/lib/pg_plansight.so", dest = "/usr/lib/postgresql/16/lib/pg_plansight.so", mode = "644" },
    { source = "target/release/pg_plansight-pg16/usr/share/postgresql/16/extension/*", dest = "/usr/share/postgresql/16/extension/", mode = "644" },
]

[package.metadata.generate-rpm.variants.pg17]
name = "plansight_17"
assets = [
    { source = "target/release/pg_plansight-pg17/usr/lib/postgresql/17/lib/pg_plansight.so", dest = "/usr/lib/postgresql/17/lib/pg_plansight.so", mode = "644" },
    { source = "target/release/pg_plansight-pg17/usr/share/postgresql/17/extension/*", dest = "/usr/share/postgresql/17/extension/", mode = "644" },
]

[package.metadata.generate-rpm.variants.pg18]
name = "plansight_18"
assets = [
    { source = "target/release/pg_plansight-pg18/usr/lib/postgresql/18/lib/pg_plansight.so", dest = "/usr/lib/postgresql/18/lib/pg_plansight.so", mode = "644" },
    { source = "target/release/pg_plansight-pg18/usr/share/postgresql/18/extension/*", dest = "/usr/share/postgresql/18/extension/", mode = "644" },
]
