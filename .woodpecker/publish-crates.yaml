# crates.io publish. Irreversible, so it is a deliberate manual run: start it from
# the Woodpecker UI ("Run pipeline" on the release tag) once the release workflows
# are green. It is a separate workflow with no dependency on the package workflows
# (matrix workflows get generated names, so depending on them by name is fragile).
#
# Order matters -- pg-plansight and pg-plansight-exporter depend on
# pg-plansight-core, so core goes first and the index must have it before the
# dependants are published. Needs a `cargo_registry_token` secret. The pgrx
# extension is not published to crates.io; it ships only as deb/rpm packages.
when:
  - event: manual
    evaluate: 'CI_COMMIT_TAG != ""'

steps:
  - name: publish
    image: rust:1-bookworm
    environment:
      CARGO_REGISTRY_TOKEN:
        from_secret: cargo_registry_token
    commands:
      - cargo publish --locked -p pg-plansight-core
      - |
        for crate in pg-plansight pg-plansight-exporter; do
          for attempt in 1 2 3 4 5 6; do
            cargo publish --locked -p $crate && break
            echo "index not ready for $crate (attempt $attempt), retrying"; sleep 20
            [ $attempt -lt 6 ] || exit 1
          done
        done
