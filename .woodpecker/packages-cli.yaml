# CLI + exporter .deb/.rpm per target (mirrors build-packages, test-deb-packages
# and test-rpm-packages in .github/workflows/packages.yml). Cross-compiles through
# `cross`, which needs the host Docker socket, so the repository must be trusted.
#
# Woodpecker has no cross-workflow artifacts, so each matrix leg builds, tests and
# uploads its own packages to the release; the upload step runs last.
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

depends_on: [verify]

matrix:
  TARGET:
    - x86_64-unknown-linux-gnu
    - aarch64-unknown-linux-gnu
    - armv7-unknown-linux-gnueabihf
    - i686-unknown-linux-gnu

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  - name: tools
    image: rust:1-bookworm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PLANSIGHT_USE_CROSS: "1"
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io binutils dpkg-dev rpm jq >/dev/null
      - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - cargo binstall -y --locked cross cargo-deb cargo-generate-rpm@0.19.0 just
      - |
        tag="$${CI_COMMIT_TAG#v}"
        cli=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pg-plansight") | .version')
        ext=$(cargo metadata --no-deps --format-version 1 --manifest-path crates/pg_extension/Cargo.toml | jq -r '.packages[] | select(.name == "pg_plansight") | .version')
        if [ -n "$tag" ] && { [ "$tag" != "$cli" ] || [ "$tag" != "$ext" ]; }; then
          echo "tag v$tag does not match crate versions (cli $cli, extension $ext)" >&2; exit 1
        fi
      - just build-all ${TARGET}
      - just validate-deb ${TARGET}
      - just validate-rpm ${TARGET}
      - just validate-glibc ${TARGET}

  - name: test-deb
    image: debian:12
    depends_on: [tools]
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
      # CI containers are minimised; reproduce the doc exclusion that once hid a missing config template.
      - printf 'path-exclude=/usr/share/doc/*\npath-include=/usr/share/doc/*/copyright\n' > /etc/dpkg/dpkg.cfg.d/99-plansight-ci-exclude-docs
      - dpkg --print-architecture
      - sh -c 'case "${TARGET}" in x86_64*) ;; *) echo "install test only runs natively on x86_64"; exit 0;; esac; for deb in target/${TARGET}/debian/*.deb; do dpkg -i "$deb"; done; pg-plansight --version; pg-plansight-exporter --version; test -d /etc/pg-plansight-exporter; su -s /bin/sh pg-plansight -c "pg-plansight-exporter --config /etc/pg-plansight-exporter/config.toml --state-db /tmp/ci-state.db state init"'

  - name: test-rpm
    image: fedora:latest
    depends_on: [tools]
    commands:
      - dnf install -y rpm systemd >/dev/null
      - sh -c 'case "${TARGET}" in x86_64*) ;; *) echo "install test only runs natively on x86_64"; exit 0;; esac; for rpm in target/${TARGET}/generate-rpm/*.rpm; do rpm -i "$rpm"; done; pg-plansight --version; pg-plansight-exporter --version; getent passwd pg-plansight; pg-plansight-exporter --config /etc/pg-plansight-exporter/config.toml --state-db /tmp/ci-state.db state init'

  - name: release
    image: woodpeckerci/plugin-release
    depends_on: [test-deb, test-rpm]
    when:
      event: tag
    settings:
      api_key:
        from_secret: github_token
      files:
        - target/${TARGET}/debian/*.deb
        - target/${TARGET}/generate-rpm/*.rpm
      checksum: sha256
      title: ${CI_COMMIT_TAG}
