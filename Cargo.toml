[package]
name = "pg_loganalyze"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.98"
sqlformat = "0.2"
syntect = "5.0"
syntect-tui = "3.0"
arboard = "3.0"
rayon = "1.8"
hashbrown = { version = "0.15", features = ["rayon"] }
once_cell = "1.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.0"

[[bench]]
name = "log_parsing"
harness = false
