[workspace]
members = ["crates/core", "crates/tui", "crates/exporter", "crates/bench-harness"]
default-members = ["crates/tui"]
# The pgrx extension is its own independent workspace: it requires the pgrx
# toolchain and a pgNN feature to build, so it must not be pulled into plain
# `cargo build/clippy --workspace` (or CI without cargo-pgrx). Build it via
# `cargo pgrx` from crates/pg_extension.
exclude = ["crates/pg_extension"]
resolver = "3"

[workspace.dependencies]
# Core parsing dependencies
anyhow = "1.0.98"
async-trait = "0.1"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
# `rayon` is enabled per-crate via core's `parallel` feature so the embeddable
# build stays rayon-free; tui/exporter use hashbrown without parallel methods.
hashbrown = { version = "0.17" }
once_cell = "1.19"
rayon = "1.8"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.62", features = ["visitor"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# TUI dependencies
arboard = "3.0"
clap = { version = "4.0", features = ["derive"] }
# Pinned to 0.29: syntect-tui 3.0.6 (SQL syntax highlighting) does not yet
# support ratatui 0.30; bumping pulls two incompatible ratatui versions.
crossterm = "0.29"
ratatui = "0.29"
syntect = "5.0"
syntect-tui = "3.0"

# Statistical analysis dependencies
statrs = "0.18"

# Dev dependencies
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.0"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio-postgres = "0.7"


[profile.dev.package."*"]
opt-level = 3

# Release profile tuned for the regex/parse-bound workload. LTO + a single
# codegen unit let the optimizer inline across the parser/analysis crates,
# which is where the hot loops live.
[profile.release]
lto = "thin"
codegen-units = 1
