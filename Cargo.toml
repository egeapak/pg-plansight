[workspace]
members = ["crates/core", "crates/tui", "crates/exporter", "crates/bench-harness"]
default-members = ["crates/tui"]
# The pgrx extension is its own independent workspace: it requires the pgrx
# toolchain and a pgNN feature to build, so it must not be pulled into plain
# `cargo build/clippy --workspace` (or CI without cargo-pgrx). Build it via
# `cargo pgrx` from crates/pg_extension.
exclude = ["crates/pg_extension"]
resolver = "3"

[workspace.dependencies]
# Core parsing dependencies
anyhow = "1.0.104"
async-trait = "0.1"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
fearless_simd = "1.1"
flate2 = "1.1"
# `rayon` is enabled per-crate via core's `parallel` feature so the embeddable
# build stays rayon-free; tui/exporter use hashbrown without parallel methods.
hashbrown = { version = "0.17" }
once_cell = "1.21"
rayon = "1.12"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simdutf8 = "0.1"
sqlparser = { version = "0.63", features = ["visitor"] }
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# TUI dependencies
arboard = "3.7"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
# syntect provides SQL syntax highlighting; its highlighted segments are
# converted to ratatui Spans by a small inline helper in the TUI (crates/tui),
# rather than the syntect-tui crate, which is pinned to ratatui 0.29 and would
# otherwise pull in a second, incompatible ratatui version.
syntect = "5.3"

# Statistical analysis dependencies
statrs = "0.19"

# Dev dependencies
# CodSpeed's drop-in criterion layer: it re-exports the criterion API, adds the
# instrumentation CodSpeed needs in CI, and falls back to the stock criterion
# harness when the benchmark is run outside a CodSpeed environment, so plain
# `cargo bench` keeps working unchanged.
criterion = { package = "codspeed-criterion-compat", version = "5.0.3", features = [
    "html_reports",
] }
tempfile = "3.27"
testcontainers = "0.28"
tokio-postgres = "0.7"


[profile.dev.package."*"]
opt-level = 3

# Release profile tuned for the regex/parse-bound workload. LTO + a single
# codegen unit let the optimizer inline across the parser/analysis crates,
# which is where the hot loops live.
[profile.release]
lto = "thin"
codegen-units = 1
