[workspace]
members = ["crates/core", "crates/tui", "crates/exporter"]
default-members = ["crates/tui"]
resolver = "3"

[workspace.dependencies]
# Core parsing dependencies
anyhow = "1.0.98"
async-trait = "0.1"
bzip2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
hashbrown = { version = "0.15", features = ["rayon"] }
once_cell = "1.19"
rayon = "1.8"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = "0.57"
tokio = { version = "1.0", features = ["full"] }

# TUI dependencies
arboard = "3.0"
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
syntect = "5.0"
syntect-tui = "3.0"

# Dev dependencies
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.0"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio-postgres = "0.7"

